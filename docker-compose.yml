services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wealthlens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - wealthlens-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wealthlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/wealthlens?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-secret-change-this-before-deploy}
      CLIENT_ORIGIN: http://localhost:8080
      PORT: 3001
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-mock}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      EMAIL_DELIVERY_URL: ${EMAIL_DELIVERY_URL:-}
      EMAIL_DELIVERY_TOKEN: ${EMAIL_DELIVERY_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  wealthlens-data: